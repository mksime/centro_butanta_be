services:
  db:
    image: postgres:16-alpine
    container_name: cbbe_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbbe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbbe_secret}
      POSTGRES_DB: ${POSTGRES_DB:-centro_butanta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbbe} -d ${POSTGRES_DB:-centro_butanta}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
